<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sari-Sari Store Inventory System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Sari-Sari Store</h2>
        <ul>
            <li><a href="index.html"><span class="icon">🏠</span> Dashboard</a></li>
            <li><a href="customer.html"><span class="icon">👥</span> Customers</a></li>
            <li><a href="items.html"><span class="icon">📦</span> Items</a></li>
            <li><a href="transactions.html"><span class="icon">↔</span> Transactions</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Main Dashboard</h1>
        <div class="dashboard-stats">
            <div class="stat-card">
                <span class="icon">📦</span>
                <h3>Total Items</h3>
                <p id="total-items">...</p>
            </div>
            <div class="stat-card">
                <span class="icon">📈</span>
                <h3>Total Sales</h3>
                <p id="total-sales">...</p>
            </div>
            <div class="stat-card">
                <span class="icon">🔥</span>
                <h3>Hot Items</h3>
                <p id="hot-items">...</p>
            </div>
            <div class="stat-card">
                <span class="icon">👥</span>
                <h3>Total Customers</h3>
                <p id="total-customers">...</p>
            </div>
        </div>

        <div class="analytics">
            <h2>Analytics</h2>
            <!-- Analytics content can be added here later -->
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Fetch dashboard data
        fetch('api/dashboard.php')
            .then(response => response.json())
            .then(data => {
                document.getElementById('total-items').textContent = data.total_items.count + ' (Stock: ' + data.total_items.total_stock + ')';
                document.getElementById('total-sales').textContent = data.num_sales.count + ' (Revenue: ' + data.num_sales.total_rev + ')';
                document.getElementById('hot-items').textContent = data.hot_items.map(item => item.item_name + ': ' + item.total_sold).join(', ');
                document.getElementById('total-customers').textContent = data.num_customers.count + ' (Unique Sales: ' + data.num_customers.unique_sales + ')';
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
