<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <script>
        async function loadCustomers() {
            const response = await fetch('api/customers.php');
            const data = await response.json();
            const tableBody = document.getElementById('customer-table-body');
            tableBody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.customer_id}</td>
                    <td>${row.first_name}</td>
                    <td>${row.last_name}</td>
                    <td>${row.contact_number}</td>
                    <td>${row.address}</td>
                    <td>${row.created_at}</td>
                `;
                tableBody.appendChild(tr);
            });
        }
        window.onload = loadCustomers;
    </script>
</head>
<body>
    <header>
        <h1>Customers</h1>
    </header>
    <nav>
        <button onclick="window.location.href='index.html'">Dashboard</button>
        <button onclick="window.location.href='items.html'">Items</button>
        <button onclick="window.location.href='transactions.html'">Transactions</button>
    </nav>
    <div class="container">
        <input type="text" id="search" onkeyup="searchTable('dataTable')" placeholder="Search customers...">
        <table id="dataTable">
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Contact Number</th>
                <th>Address</th>
                <th>Created At</th>
            </tr>
            <tbody id="customer-table-body"></tbody>
        </table>
    </div>
</body>
</html>
