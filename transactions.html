<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Sari-Sari Store</h2>
        <ul>
            <li><a href="index.html"><span class="icon">🏠</span> Dashboard</a></li>
            <li><a href="customer.html"><span class="icon">👥</span> Customers</a></li>
            <li><a href="items.html"><span class="icon">📦</span> Items</a></li>
            <li><a href="transactions.html"><span class="icon">↔</span> Transactions</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Transactions</h1>
        <div class="search-bar">
            <input type="text" id="search" placeholder="Search by Customer or Item..." onkeyup="searchTable('transactionsTable')">
            <span class="search-icon">🔍</span>
        </div>
        <div class="table-wrapper">
            <table id="transactionsTable">
                <thead>
                    <tr>
                        <th>transaction_id</th>
                        <th>Customer Name</th>
                        <th>Item Name</th>
                        <th>Quantity</th>
                        <th>Total Amount</th>
                        <th>Transaction Date</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be populated via API -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        fetch('api/transactions.php')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('#transactionsTable tbody');
                data.forEach(transaction => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${transaction.transaction_id}</td>
                        <td>${transaction.customer_name}</td>
                        <td>${transaction.item_name}</td>
                        <td>${transaction.quantity}</td>
                        <td>${transaction.total_amount}</td>
                        <td>${transaction.date_added}</td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
