<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Sari-Sari Store</h2>
        <ul>
            <li><a href="index.html"><span class="icon">🏠</span> Dashboard</a></li>
            <li><a href="customer.html"><span class="icon">👥</span> Customers</a></li>
            <li><a href="items.html"><span class="icon">📦</span> Items</a></li>
            <li><a href="transactions.html"><span class="icon">↔</span> Transactions</a></li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Items</h1>
        <div class="search-bar">
            <input type="text" id="search" placeholder="Search by Name or Category..." onkeyup="searchTable('itemsTable')">
            <span class="search-icon">🔍</span>
        </div>
        <div class="table-wrapper">
            <table id="itemsTable">
                <thead>
                    <tr>
                        <th>item_id</th>
                        <th>Item Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock Quantity</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be populated via API -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        fetch('api/items.php')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('#itemsTable tbody');
                data.forEach(item => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${item.item_id}</td>
                        <td>${item.item_name}</td>
                        <td>${item.category}</td>
                        <td>${item.price}</td>
                        <td>${item.stock_quantity}</td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
