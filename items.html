<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Items</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <script>
        async function loadItems() {
            const response = await fetch('api/items.php');
            const data = await response.json();
            const tableBody = document.getElementById('items-table-body');
            tableBody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.item_id}</td>
                    <td>${row.item_name}</td>
                    <td>${row.category}</td>
                    <td>₱${parseFloat(row.price).toFixed(2)}</td>
                    <td>${row.stock_quantity}</td>
                    <td>${row.created_at}</td>
                `;
                tableBody.appendChild(tr);
            });
        }
        window.onload = loadItems;
    </script>
</head>
<body>
    <header>
        <h1>Items</h1>
    </header>
    <nav>
        <button onclick="window.location.href='index.html'">Dashboard</button>
        <button onclick="window.location.href='customer.html'">Customers</button>
        <button onclick="window.location.href='transactions.html'">Transactions</button>
    </nav>
    <div class="container">
        <input type="text" id="search" onkeyup="searchTable('dataTable')" placeholder="Search items...">
        <table id="dataTable">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock Quantity</th>
                <th>Created At</th>
            </tr>
            <tbody id="items-table-body"></tbody>
        </table>
    </div>
</body>
</html>
